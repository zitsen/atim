name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: sudo apt-get install -y protobuf-compiler libssl-dev perl || (sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev perl)
        if: runner.os == 'Linux'
        timeout-minutes: 5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        run: |
          curl -LO "https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz"
          tar xf "zig-linux-x86_64-0.14.0.tar.xz"
          echo "$PWD/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
        if: runner.os == 'Linux'

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild
        if: runner.os == 'Linux'

      - name: Install protoc (Windows)
        run: choco install protoc -y
        if: runner.os == 'Windows'

      - name: Build release binary (zigbuild, Linux)
        run: cargo zigbuild --release --target ${{ matrix.target }}
        if: runner.os == 'Linux'

      - name: Build release binary (MSVC, Windows)
        run: cargo build --release --target ${{ matrix.target }}
        if: runner.os == 'Windows'

      - name: Package binary
        shell: bash
        run: |
          BIN_NAME="atim"
          TARGET_DIR="target/${{ matrix.target }}/release"
          ARCHIVE_NAME="atim-${{ matrix.target }}.tar.gz"
          if [ -f "$TARGET_DIR/$BIN_NAME.exe" ]; then
            cp "$TARGET_DIR/$BIN_NAME.exe" "$BIN_NAME.exe"
            tar czf "$ARCHIVE_NAME" "$BIN_NAME.exe"
          else
            cp "$TARGET_DIR/$BIN_NAME" "$BIN_NAME"
            tar czf "$ARCHIVE_NAME" "$BIN_NAME"
          fi
          echo "archive=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Generate checksum
        run: sha256sum "${{ env.archive }}" > "${{ env.archive }}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: atim-${{ matrix.target }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256

  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog from conventional commits
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p' || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="${PREV_TAG}.."
          fi

          CHANGELOG=""
          add_section() {
            local label="$1"
            local emoji="$2"
            local commits="$3"
            if [ -n "$commits" ]; then
              CHANGELOG+="## ${emoji} ${label}\n"
              while IFS= read -r line; do
                [ -z "$line" ] && continue
                msg=$(echo "$line" | sed -E 's/^(feat|fix|docs|refactor|test|chore|perf|style)\(?[^)]*\)?:\s*//')
                CHANGELOG+="- ${msg}\n"
              done <<< "$commits"
              CHANGELOG+="\n"
            fi
          }

          FEATS=$(git log ${RANGE}--pretty=format:'%s' --grep='^feat' || true)
          FIXES=$(git log ${RANGE}--pretty=format:'%s' --grep='^fix' || true)
          DOCS=$(git log ${RANGE}--pretty=format:'%s' --grep='^docs' || true)
          REFACTOR=$(git log ${RANGE}--pretty=format:'%s' --grep='^refactor' || true)
          PERF=$(git log ${RANGE}--pretty=format:'%s' --grep='^perf' || true)
          CHORES=$(git log ${RANGE}--pretty=format:'%s' --grep='^chore' || true)
          TESTS=$(git log ${RANGE}--pretty=format:'%s' --grep='^test' || true)

          add_section "Features" "✨" "$FEATS"
          add_section "Bug Fixes" "🐛" "$FIXES"
          add_section "Documentation" "📝" "$DOCS"
          add_section "Refactoring" "♻️" "$REFACTOR"
          add_section "Performance" "⚡️" "$PERF"
          add_section "Chores" "🔧" "$CHORES"
          add_section "Tests" "✅" "$TESTS"

          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "changelog=${CHANGELOG}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

  upload-x86_64-linux:
    name: Upload x86_64-linux
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atim-x86_64-unknown-linux-musl
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" atim-x86_64-unknown-linux-musl.tar.gz atim-x86_64-unknown-linux-musl.tar.gz.sha256 --clobber

  upload-aarch64-linux:
    name: Upload aarch64-linux
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atim-aarch64-unknown-linux-musl
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" atim-aarch64-unknown-linux-musl.tar.gz atim-aarch64-unknown-linux-musl.tar.gz.sha256 --clobber

  upload-windows:
    name: Upload windows
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atim-x86_64-pc-windows-msvc
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" atim-x86_64-pc-windows-msvc.tar.gz atim-x86_64-pc-windows-msvc.tar.gz.sha256 --clobber

  packaging:
    name: Generate Homebrew/AUR
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate Homebrew formula
        run: |
          X86_64_SHA=$(cat atim-x86_64-unknown-linux-musl/atim-x86_64-unknown-linux-musl.tar.gz.sha256 | awk '{print $1}')
          AARCH64_SHA=$(cat atim-aarch64-unknown-linux-musl/atim-aarch64-unknown-linux-musl.tar.gz.sha256 | awk '{print $1}')
          VERSION="${{ steps.version.outputs.version }}"

          cat > atim.rb << FORMULA
          class Atim < Formula
            desc "AI Agent Through IM"
            homepage "https://github.com/${{ github.repository }}"
            version "$VERSION"
            license "MIT"

            on_macos do
              odie "atim does not support macOS yet. Please use Linux."
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/${{ github.repository }}/releases/download/v#{version}/atim-aarch64-unknown-linux-musl.tar.gz"
                sha256 "$AARCH64_SHA"
              else
                url "https://github.com/${{ github.repository }}/releases/download/v#{version}/atim-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$X86_64_SHA"
              end
            end

            def install
              bin.install "atim"
            end

            test do
              assert_match "atim", shell_output("\#{bin}/atim --help")
            end
          end
          FORMULA

      - name: Generate AUR PKGBUILD
        run: |
          X86_64_SHA=$(cat atim-x86_64-unknown-linux-musl/atim-x86_64-unknown-linux-musl.tar.gz.sha256 | awk '{print $1}')
          VERSION="${{ steps.version.outputs.version }}"

          cat > PKGBUILD << 'PKGBUILD_EOF'
          # Maintainer: Atim maintainers
          pkgname=atim
          pkgver=__VERSION__
          pkgrel=1
          pkgdesc="AI Agent Through IM"
          arch=('x86_64')
          url="https://github.com/__REPO__"
          license=('MIT')
          depends=('tmux')
          source_x86_64=("${url}/releases/download/v${pkgver}/atim-x86_64-unknown-linux-musl.tar.gz")
          sha256sums_x86_64=('__SHA256__')

          package() {
            install -Dm755 atim "${pkgdir}/usr/bin/atim"
          }
          PKGBUILD_EOF

          sed -i "s|__VERSION__|$VERSION|" PKGBUILD
          sed -i "s|__REPO__|${{ github.repository }}|" PKGBUILD
          sed -i "s|__SHA256__|$X86_64_SHA|" PKGBUILD

      - name: Upload Homebrew formula
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: atim.rb

      - name: Upload AUR PKGBUILD
        uses: actions/upload-artifact@v4
        with:
          name: aur-pkgbuild
          path: PKGBUILD
