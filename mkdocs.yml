site_name: Atim
site_description: AI Agent Through IM — Talk to Claude Code through Telegram or Feishu
site_url: https://zitsen.github.io/atim/
repo_url: https://github.com/zitsen/atim
repo_name: zitsen/atim

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started:
    - Installation: install.md
    - Quick Start: quickstart.md
    - Windows: windows.md
  - Usage:
    - Feishu: feishu.md
    - Telegram: telegram.md
  - Reference:
    - Commands: commands.md
    - Configuration: configuration.md
    - Features: features.md
  - Contributing: contributing.md
  - Developer:
    - Architecture: dev/architecture.md
    - Session Lifecycle: dev/session-lifecycle.md
    - IM Interface: dev/im-interface.md
    - Feishu Integration: dev/feishu-integration.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list

plugins:
  - search
