[workspace]
resolver = "2"
members = [
    "crates/aim-core",
    "crates/aim-tmux",
    "crates/aim-parser",
    "crates/aim-im",
    "crates/aim-queue",
    "crates/aim-state",
    "crates/aim-monitor",
    "crates/aim-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
async-trait = "0.1"
pulldown-cmark = "0.12"
libc = "0.2"
moka = "0.12"
aiofiles = "0.1"  # not needed, we use tokio::fs
