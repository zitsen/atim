[workspace]
resolver = "2"
members = [
    "crates/atim-core",
    "crates/atim-tmux",
    "crates/atim-parser",
    "crates/atim-im",
    "crates/atim-queue",
    "crates/atim-state",
    "crates/atim-monitor",
    "crates/atim-bin",
]

[workspace.package]
version = "0.4.15"
edition = "2024"
license = "MIT"
description = "AI Agent Through IM"
repository = "https://github.com/zitsen/atim"
keywords = ["ai", "agent", "bot", "telegram", "claude"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
home = "0.5"
regex = "1"
async-trait = "0.1"
pulldown-cmark = "0.13"
libc = "0.2"
futures-util = "0.3"
moka = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
